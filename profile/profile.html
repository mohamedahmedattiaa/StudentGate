<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria University National</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="logo">
        <img src="alex.jpg" alt="ANU">
    </div>

    <div class="header">
        <a href="../Home/home.html">Home</a>
        <a href="../Notes/note.html">Study Materials</a>
        <a href="../Events/events.html">Events</a>
        <a href="../foodcourt/Food court.html">Food court</a>
        <a href="../About Us/AboutUs.html">About Us</a>
        <a href="../profile/profile.html">Profile</a>
    </div>

    <!-- Profile Display -->
    <div class="profile-container" id="profile-container">
        <img src="../photos/unphoto.jpg" alt="Profile Picture" class="profile-image" id="profile-pic">
        <h1 class="profile-name" id="profile-name">Your Name</h1>
        <p class="profile-info" id="profile-email">Email: your-email@example.com</p>
        <p class="profile-info" id="profile-phone">Phone: your-phone</p>
        <p class="profile-info" id="profile-address">Address: your-address</p>
        <p class="profile-info" id="profile-gender">Gender: your-gender</p>
        <p class="profile-info" id="profile-birth">Birth Date: your-birth-date</p>
        <p class="profile-info" id="profile-college">College: your-college</p>
        <p class="profile-info" id="profile-department">Department: your-department</p>
        <p class="profile-info" id="profile-year">Year: your-year</p>
        
        <!-- Edit Profile Button -->
        <button class="edit-btn" onclick="showForm()">Edit Profile</button>
        
        <!-- Social Media Links -->
        <div class="social-media-icons">
            <a href="https://www.facebook.com" target="_blank" class="social-icon facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.linkedin.com" target="_blank" class="social-icon linkedin">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://github.com" target="_blank" class="social-icon github">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </div>

    <!-- Profile Edit Form -->
    <div class="form-container" id="form-container" style="display: none;">
        <form id="profile-form" onsubmit="saveProfile(event);">
            <h2>Edit Your Profile</h2>
            <label for="profile-picture">Profile Picture:</label>
            <input type="file" id="profile-picture" name="profile-picture" accept="image/*"><br>
            <button type="submit">Save</button>
            <button type="button" onclick="cancelEdit()">Cancel</button>
        </form>
    </div>

    <script src="profile.js"></script>
</body>
</html>

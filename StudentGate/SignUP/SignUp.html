<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="SignUP.css">
</head>
<body>
    <header>
        <p>Welcome! Please sign up to create your account.</p>
        <p>If you face any issues, feel free to contact our support team.</p>
    </header>

    <div class="SignIn-Container">
        <form class="form-section" action="SignUp.php" method="post">
            <h2>Create Your Account</h2>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" maxlength="8" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>
            <br><br>

            <label for="birth">Birth Date:</label>
            <input type="date" id="birth" name="birth" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="^[0-9]{10}$" placeholder="Enter your 10-digit phone number" required>
            <br><br>

            <label for="address">Home Address:</label>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your full address" required></textarea>
            <br><br>

            <label for="year">Student Year:</label>
            <select id="year" name="student-year" required>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
                <option value="5">5th Year</option>
                <option value="6">6th Year</option>
                <option value="7">7th Year</option>
            </select>
            <br><br>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="SIM">Software Industry and Multimedia</option>
                <option value="IS">Information Systems</option>
                <option value="CS">Computer Science</option>
                <option value="MS">Medicine and Surgery Program</option>
                <option value="ODS">Oral and Dental Surgery Program</option>
                <option value="P">Pharmacy Program - Pharm D Clinical</option>
                <option value="CCE">Computer and Communication Engineering Program</option>
                <option value="DSAI">Data Science and Artificial Intelligence Program</option>
                <option value="BF">Banking and Finance Program</option>
                <option value="M">Management Program</option>
                <option value="MRE">Mechatronics and Robotics Engineering Program</option>
                <option value="EME">Electromechanical Engineering Program</option>
                <option value="MLSCM">Marketing, Logistics and Supply Chain Management Program</option>
                <option value="AIS">Accounting and Information Systems Program</option>
                <option value="AUD">Architecture and Urban Design</option>
                <option value="GSP">Geomatics and Surveying Program</option>
                <option value="DMP">Digital Media Program</option>
                <option value="ALP">Acoustics and Linguistics Program</option>
                <option value="PNGEP">Petroleum and Natural Gas Engineering Program</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <div id="cs-department-options" style="display:none;">
                <label for="cs-program">Please select a specific program:</label>
                <br>
                <button type="button" class="btn" onclick="selectAI()">Artificial Intelligence</button>
                <button type="button" class="btn" onclick="selectIS()">Information Systems</button>
            </div>
            <br><br>

            <label for="education-level">Highest Level of Education:</label>
            <select id="education-level" name="education-level" required>
                <option value="highschool">High School</option>
                <option value="associate">Associate Degree</option>
                <option value="bachelor">Bachelor's Degree</option>
                <option value="master">Master's Degree</option>
                <option value="doctorate">Doctorate Degree</option>
            </select>
            <br><br>

            <label for="communication">Preferred Communication Mode:</label>
            <select id="communication" name="communication" required>
                <option value="email">Email</option>
                <option value="phone">Phone Call</option>
                <option value="text">Text Message</option>
                <option value="social">Social Media</option>
            </select>
            <br><br>

            <label for="skills">Skills (e.g. programming languages, software):</label>
            <textarea id="skills" name="skills" rows="4" cols="50" placeholder="List your skills" required></textarea>
            <br><br>

            <label for="hobbies">Hobbies and Interests:</label>
            <textarea id="hobbies" name="hobbies" rows="4" cols="50" placeholder="List your hobbies" required></textarea>
            <br><br>

            <label for="languages">Languages Spoken:</label>
            <textarea id="languages" name="languages" rows="2" cols="50" placeholder="List languages you speak" required></textarea>
            <br><br>

            <label for="activities">Extracurricular Activities (e.g. sports, clubs):</label>
            <textarea id="activities" name="activities" rows="4" cols="50" placeholder="List your extracurricular activities" required></textarea>
            <br><br>

            <label for="scholarships">Scholarships or Awards:</label>
            <textarea id="scholarships" name="scholarships" rows="2" cols="50" placeholder="List any scholarships or awards" required></textarea>
            <br><br>

            <button class="btn">Sign Up</button>
            <br><br>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Alexandria National University. All rights reserved.</p>
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>
    </footer>

    <script>
        document.getElementById('department').addEventListener('change', function() {
            var csOptions = document.getElementById('cs-department-options');
            if (this.value === 'CS') {
                csOptions.style.display = 'block';
            } else {
                csOptions.style.display = 'none';
            }
        });

        function selectAI() {
            alert("You selected Artificial Intelligence.");
        }

        function selectIS() {
            alert("You selected Information Systems.");
        }
    </script>
</body>
</html>

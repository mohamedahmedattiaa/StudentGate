<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="SignUP.css">
</head>
<body>
    <div class="logo">
        <img src="alex.jpg" alt="logo">
    </div>
    <div class="SignIn-Container">
        <form class="form-section" action="SignUp.php" method="post">
            <h2>Create Your Account</h2>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" maxlength="8" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>
            <br><br>

            <label for="birth">Birth Date:</label>
            <input type="date" id="birth" name="birth" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="^[0-9]{10}$" placeholder="Enter your 10-digit phone number" required>
            <br><br>

            <label for="address">Home Address:</label>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your full address" required></textarea>
            <br><br>

            <label for="college">College:</label>
            <select id="college" name="college" required>
                <option value="">--Select College--</option>
                <option value="cs">Computer Science</option>
                <option value="medicine">Medicine</option>
                <option value="engineering">Engineering</option>
                <option value="business">Business</option>
                <option value="arts">Arts</option>
            </select>
            
            <div id="department-container" style="display:none;">
                <label for="department">Department:</label>
                <select id="department" name="department">
                    <!-- Departments will be dynamically populated here -->
                </select>
            </div>
            <br><br>

            <label for="year">Student Year:</label>
            <select id="year" name="student-year" required>
                <option value="">--Select StudentYear--</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
                <option value="5">5th Year</option>
                <option value="6">6th Year</option>
                <option value="7">7th Year</option>
            </select>
            <br><br>


            <label for="education-level">Highest Level of Education:</label>
            <select id="education-level" name="education-level" required>
                <option value="highschool">High School</option>
                <option value="associate">Associate Degree</option>
                <option value="bachelor">Bachelor's Degree</option>
                <option value="master">Master's Degree</option>
                <option value="doctorate">Doctorate Degree</option>
            </select>
            <br><br>

            <label for="communication">Preferred Communication Mode:</label>
            <select id="communication" name="communication" required>
                <option value="email">Email</option>
                <option value="phone">Phone Call</option>
                <option value="text">Text Message</option>
                <option value="social">Social Media</option>
            </select>
            <br><br>

            <label for="skills">Skills (e.g. programming languages, software):</label>
            <textarea id="skills" name="skills" rows="4" cols="50" placeholder="List your skills" required></textarea>
            <br><br>

            <label for="hobbies">Hobbies and Interests:</label>
            <textarea id="hobbies" name="hobbies" rows="4" cols="50" placeholder="List your hobbies" required></textarea>
            <br><br>

            <label for="languages">Languages Spoken:</label>
            <textarea id="languages" name="languages" rows="2" cols="50" placeholder="List languages you speak" required></textarea>
            <br><br>

            <label for="activities">Extracurricular Activities (e.g. sports, clubs):</label>
            <textarea id="activities" name="activities" rows="4" cols="50" placeholder="List your extracurricular activities" required></textarea>
            <br><br>

            <label for="scholarships">Scholarships or Awards:</label>
            <textarea id="scholarships" name="scholarships" rows="2" cols="50" placeholder="List any scholarships or awards" required></textarea>
            <br><br>

            <div class="button-container">
                <button class="btn login-btn"><a href="../Home/home.html">Login</a></button>
                <button class="btn signup-btn"><a href="../SignUP/SignUp.html">Signup</a></button>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Alexandria National University. All rights reserved.</p>
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>
    </footer>

    <script>
        const departmentOptions = {
            cs: [
                { value: 'SIM', text: 'Software Industry and Multimedia' },
                { value: 'IS', text: 'Information Systems' },
                { value: 'DSAI', text: 'Data Science and Artificial Intelligence Program' },
                { value: 'CS', text: 'Cyber Security' }
            ],
            medicine: [
                { value: 'MS', text: 'Medicine and Surgery Program' },
                { value: 'ODS', text: 'Oral and Dental Surgery Program' },
                { value: 'P', text: 'Pharmacy Program - Pharm D Clinical' }
            ],
            engineering: [
                { value: 'CCE', text: 'Computer and Communication Engineering Program' },
                { value: 'MRE', text: 'Mechatronics and Robotics Engineering Program' },
                { value: 'EME', text: 'Electromechanical Engineering Program' },
                { value: 'AUD', text: 'Architecture and Urban Design' },
                { value: 'PNGEP', text: 'Petroleum and Natural Gas Engineering Program' }
            ],
            business: [
                { value: 'BF', text: 'Banking and Finance Program' },
                { value: 'M', text: 'Management Program' },
                { value: 'AIS', text: 'Accounting and Information Systems Program' },
                { value: 'MLSCM', text: 'Marketing, Logistics and Supply Chain Management Program' }
            ],
            arts: [
                { value: 'GSP', text: 'Geomatics and Surveying Program' },
                { value: 'DMP', text: 'Digital Media Program' },
                { value: 'ALP', text: 'Acoustics and Linguistics Program' }
            ]
        };
    
        document.getElementById('college').addEventListener('change', function () {
            const college = this.value;
            const departmentSelect = document.getElementById('department');
            const departmentContainer = document.getElementById('department-container');
    
            // Clear previous department options
            departmentSelect.innerHTML = '';
    
            if (college) {
                departmentContainer.style.display = 'block';
    
                // Add default option
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.text = '--Select Department--';
                departmentSelect.appendChild(defaultOption);
    
                // Populate departments based on college selection
                departmentOptions[college].forEach(department => {
                    const option = document.createElement('option');
                    option.value = department.value;
                    option.text = department.text;
                    departmentSelect.appendChild(option);
                });
            } else {
                departmentContainer.style.display = 'none';
            }
        });
    
        document.getElementById('department').addEventListener('change', function () {
            switch (this.value) {
                case 'DSAI':
                    alert('You selected Artificial Intelligence.');
                    break;
                case 'IS':
                    alert('You selected Information Systems.');
                    break;
                default:
                    alert('You selected ' + this.options[this.selectedIndex].text + '.');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandria National University</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

</head>
<body>
    
    <header>
        <h2>Welcome, students of Alexandria National University</h2>
    </header>
    <div class="login-container">
        <!-- Left side (form section) -->
        <form id="loginForm" class="form-section" action="#" method="post">
            <h2>Login with your account</h2>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"  minlength="8" maxlength="20" required>
            <div class="button-container">
                <button type="submit" class="btn login-btn">Login</button>
                <button type="button" class="btn signup-btn" onclick="signup()">Sign Up</button>
            </div>
            <p><a class="l" href="forgot_password.html">Forgot password?</a></p>
        </form>
        <!-- Right side (image section) -->
        <div class="image-section">
            <img src="alex.jpg" alt="University Image">
        </div>
    </div>
    

    <footer>
        <p>&copy; 2024 Alexandria National University. All rights reserved.</p>
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>
    </footer>
    <script src="login.js"></script>
</body>
</html>

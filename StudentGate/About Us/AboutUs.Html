<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>About Us</title>
</head>
<body>
    <header>
        <h1>About Us</h1>
        <p>We are a team of 4 students from Alexandria University National SIM program. This website aims to make university life easier for students by providing everything they need in one place.</p>
    </header>
    <main class="about-us-container">
        <div class="team-member" id="member1">
            <img src="default.png" alt="Member 1" class="profile-pic">
            <h2>Member 1</h2>
            <input type="file" onchange="previewImage(this, 'member1')" />
        </div>
        <div class="team-member" id="member2">
            <img src="default.png" alt="Member 2" class="profile-pic">
            <h2>Member 2</h2>
            <input type="file" onchange="previewImage(this, 'member2')" />
        </div>
        <div class="team-member" id="member3">
            <img src="default.png" alt="Member 3" class="profile-pic">
            <h2>Member 3</h2>
            <input type="file" onchange="previewImage(this, 'member3')" />
        </div>
        <div class="team-member" id="member4">
            <img src="default.png" alt="Member 4" class="profile-pic">
            <h2>Member 4</h2>
            <input type="file" onchange="previewImage(this, 'member4')" />
        </div>
    </main>
    <footer>
        <p>© 2024 Alexandria University National | All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>

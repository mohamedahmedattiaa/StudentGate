<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="note.css">
    <title>Notes</title>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const hamburgerMenu = document.querySelector(".hamburger-menu");
            sidebar.classList.toggle("active");
            if (sidebar.classList.contains("active")) {
                hamburgerMenu.style.left = "270px";
            } else {
                hamburgerMenu.style.left = "20px"; 
            }
        }

        function updateYears() {
            const college = document.getElementById("college-select").value;
            const yearSelect = document.getElementById("year-filter");

            yearSelect.innerHTML = "";

            let years = [];
            if (college === "medicine") {
                years = ["1", "2", "3", "4", "5", "6", "7"];
            } else if (college === "dentistry" || college === "pharmacy") {
                years = ["1", "2", "3", "4", "5", "6"];
            } else if (college === "computer") {
                years = ["1", "2", "3", "4"];
            }

            years.forEach(year => {
                const option = document.createElement("option");
                option.value = year;
                option.textContent = 'Year ' + year;
                yearSelect.appendChild(option);
            });
        }

        document.addEventListener("DOMContentloaded", updateYears);

        function uploadNote() {
            const college = document.getElementById("college-select").value;
            const year = document.getElementById("year-filter").value;
            const fileInput = document.getElementById("note-file");
            const textInput = document.getElementById("note-text");
            const file = fileInput.files[0];
            const text = textInput.value.trim(); 

            if (!file && !text) {
                alert("Please select a note to upload or write something.");
                return;
            }

            if (!college || !year) {
                alert("Please select both your college and year.");
                return;
            }

            const formData = new FormData();
            formData.append("note", file);
            formData.append("college", college);
            formData.append("year", year);
            formData.append("text", text); 
            fetch('/upload-note', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Note uploaded successfully!");
                    addNoteToGrid(text, file); 
                } else {
                    alert("Failed to upload note.");
                }
            })
            .catch(error => {
                console.error("Error uploading note:", error);
                alert("Error uploading note.");
            });
        }

        function addNoteToGrid(text, file) {
            const notesGrid = document.querySelector('.notes-grid');

           
            if (text) {
                const noteText = document.createElement("div");
                noteText.classList.add("note-text");
                noteText.textContent = text;
                notesGrid.appendChild(noteText);
            }

            
            if (file) {
                const note = document.createElement("div");
                note.classList.add("note");

                const noteImage = document.createElement("img");
                noteImage.src = URL.createObjectURL(file); 
                noteImage.alt = "Uploaded Note";
                note.appendChild(noteImage);

                notesGrid.appendChild(note);
            }
        }
    </script>
</head>
<body>
    <div class="logo">
        <img src="alex.jpg" alt="ANU">
    </div>
    <div class="header">
        <a href="../Home/home.html">Home</a>
        <a href="../Notes/note.html">Study Materials</a>
        <a href="../Events/events.html">Events</a>
        <a href="../foodcourt/Food court.html">Food court</a>
        <a href="../About Us/AboutUs.html">About Us</a>
        <a href="../profile/profile.html">Profile</a>
    </div>
    
    <div class="note">
        <h1>Notes</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for Notes...." onkeyup="searchNotes()">
        </div>
        <br>
    </div>
    
    <div class="notes-grid">
        
    </div>

    <div class="hamburger-menu" onclick="toggleSidebar()">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="filter">
            <label>Choose your college:</label>
            <select id="college-select" onchange="updateYears()">
                <option value="medicine">medicine</option>
                <option value="dentistry">Dentistry</option>
                <option value="pharmacy">Pharmacy</option>
                <option value="computer">Computer Science</option>
            </select>
        </div>
        
        <div class="filter">
            <label>Choose your year:</label>
            <select id="year-filter"></select>
        </div>
        
        <div class="upload-section">
            <span>Upload Notes:</span>
            <input type="file" id="note-file" />
            <textarea id="note-text" placeholder="Write your note here..."></textarea>
            <button onclick="uploadNote()">Upload</button>
        </div>
    </div>
</body>
</html>
